<!doctype html>
<html lang="ko">
<head>
  <!-- 지금은 메인(/)이 캐릭터 페이지로 바로 이동합니다.
       나중에 메인을 브랜딩 메인 페이지로 바꿀 때 아래를 함께 바꿔야 합니다:
       1) 이동 스크립트(location.replace)와 meta refresh 삭제
       2) title·description·og 값(특히 og:image)을 메인 페이지용으로 교체
       3) body 주황 배경·noscript 링크를 실제 메인 내용으로 교체 -->
  <script>location.replace('character/');</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- JS가 꺼진 경우 대비 -->
  <meta http-equiv="refresh" content="0; url=character/">
  <title>플로 — FlowKat 캐릭터</title>
  <meta name="description" content="데이터 탐험가 플로를 소개합니다.">
  <!-- 카톡 등 공유 미리보기 (현재는 캐릭터 페이지와 같은 값) -->
  <meta property="og:title" content="플로 — FlowKat 캐릭터">
  <meta property="og:description" content="데이터 탐험가 플로를 소개합니다.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://brand.flowkat.dev/">
  <meta property="og:image" content="https://brand.flowkat.dev/character/images/og-v2.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/png" href="character/images/favicon.png">
  <style>html, body { margin: 0; min-height: 100%; background: #ff4e0f; }</style>
</head>
<body>
  <noscript><p><a href="character/">캐릭터 페이지 열기</a></p></noscript>
</body>
</html>
