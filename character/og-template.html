<!doctype html>
<!-- 공유 미리보기 이미지(images/og-v2.png)를 만드는 1200×630 템플릿
     페이지에서는 링크하지 않음. 브라우저로 열어 1200×630 그대로 캡처해서 사용.
     카톡·슬랙이 가장자리를 잘라내므로 글자와 얼굴은 가운데 1000×500 안쪽에만 둠 -->
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <title>FlowKat OG Template</title>
  <style>
    @font-face {
      font-family: "Pretendard";
      src: url("fonts/Pretendard-Regular.woff2") format("woff2");
      font-weight: 400;
    }
    @font-face {
      font-family: "Pretendard";
      src: url("fonts/Pretendard-Bold.woff2") format("woff2");
      font-weight: 700;
    }
    :root { --orange: #ff4e0f; --ink: #0f0f10; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: #ddd; }

    .og {
      position: relative;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: var(--orange);
      color: var(--ink);
      font-family: "Pretendard", system-ui, sans-serif;
    }

    /* FlowKat ── Character Design : "플로" 타이포 폭에 맞춰 양끝 정렬 */
    .og-top {
      position: absolute;
      top: 88px;
      left: 50%;
      width: 500px;
      transform: translateX(-50%);
      display: flex;
      justify-content: space-between;
      font-size: 26px;
      line-height: 1;
    }
    .og-top b { font-weight: 700; }

    /* "플로" 타이포: 전체 노출 */
    .og-title {
      position: absolute;
      top: 136px;
      left: 50%;
      width: 500px;
      transform: translateX(-50%);
    }
    .og-title img { display: block; width: 100%; }

    /* 손 흔드는 플로: 타이포 오른쪽 아래, 몸통은 이미지 아래 끝에서 잘림 */
    .og-char {
      position: absolute;
      top: 360px;
      left: 640px;
      width: 290px;
    }
    .og-char img { display: block; width: 100%; }
  </style>
</head>
<body>
  <div class="og">
    <div class="og-top"><b>FlowKat</b><span>Character Design</span></div>
    <div class="og-title"><img src="images/flow-word.svg" alt="플로"></div>
    <div class="og-char"><img src="images/hero.svg" alt=""></div>
  </div>
</body>
</html>
